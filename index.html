<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street for Paradise</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0c0c;
      font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      color: #f2ece4;
      user-select: none;
    }
    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;
    }

    /* ---------- HUD ---------- */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #hud.visible { opacity: 1; }

    #controls {
      position: absolute;
      top: 18px;
      left: 18px;
      padding: 12px 16px;
      background: rgba(8, 8, 10, 0.55);
      border-left: 3px solid #d9a441;
      font-size: 13px;
      line-height: 1.7;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }
    #controls h2 {
      font-size: 12px;
      color: #d9a441;
      letter-spacing: 0.2em;
      margin-bottom: 4px;
    }
    #controls .key {
      display: inline-block;
      min-width: 64px;
      color: #ffffff;
      font-weight: bold;
    }
    #controls .desc { color: #c9c2b8; }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 22px;
      height: 22px;
      transform: translate(-50%, -50%);
    }
    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 2px rgba(0, 0, 0, 0.9);
    }
    #crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
    #crosshair::after { top: 10px; left: 0; width: 22px; height: 2px; }
    #crosshair .dot {
      position: absolute;
      top: 9px;
      left: 9px;
      width: 4px;
      height: 4px;
      background: #d9a441;
      border-radius: 50%;
      z-index: 1;
    }

    /* ---------- Schermata iniziale ---------- */
    #start-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background:
        radial-gradient(ellipse at center, rgba(20, 16, 14, 0.35) 0%, rgba(6, 5, 5, 0.92) 75%),
        linear-gradient(180deg, rgba(60, 40, 30, 0.35), rgba(0, 0, 0, 0.6));
      transition: opacity 0.35s ease;
      z-index: 10;
    }
    #start-screen.hidden { opacity: 0; pointer-events: none; }
    #start-screen h1 {
      font-family: Impact, "Arial Black", "Helvetica Neue", sans-serif;
      font-size: clamp(40px, 8vw, 104px);
      letter-spacing: 0.06em;
      color: #f4efe6;
      text-shadow: 0 4px 0 #000, 0 0 40px rgba(217, 164, 65, 0.35);
      text-align: center;
      line-height: 0.95;
    }
    #start-screen h1 span { color: #d9a441; }
    #start-screen .tagline {
      margin-top: 14px;
      font-size: 14px;
      letter-spacing: 0.5em;
      color: #a8a096;
      text-transform: uppercase;
    }
    #start-hint {
      margin-top: 48px;
      padding: 12px 30px;
      border: 2px solid #d9a441;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #fff;
      background: rgba(0, 0, 0, 0.4);
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    #error-box {
      display: none;
      margin-top: 24px;
      max-width: 80vw;
      padding: 10px 14px;
      background: rgba(140, 20, 20, 0.85);
      font-size: 13px;
      font-family: monospace;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="game-canvas" tabindex="0"></canvas>

  <div id="hud">
    <div id="controls">
      <h2>Comandi</h2>
      <div><span class="key">W A S D</span><span class="desc">Muoviti</span></div>
      <div><span class="key">Shift</span><span class="desc">Corri</span></div>
      <div><span class="key">Spazio</span><span class="desc">Salta</span></div>
      <div><span class="key">Mouse</span><span class="desc">Visuale</span></div>
      <div><span class="key">Rotella</span><span class="desc">Zoom</span></div>
      <div><span class="key">Esc</span><span class="desc">Pausa</span></div>
    </div>
    <div id="crosshair"><div class="dot"></div></div>
  </div>

  <div id="start-screen">
    <h1>STREET FOR <span>PARADISE</span></h1>
    <div class="tagline">Liberty of the streets</div>
    <div id="start-hint">Clicca per iniziare</div>
    <div id="error-box"></div>
  </div>

  <script>
    // Mostra a schermo eventuali errori di caricamento (es. CDN non raggiungibile).
    function showGameError(msg) {
      var box = document.getElementById('error-box');
      if (box) {
        box.textContent = 'Errore: ' + msg;
        box.style.display = 'block';
      }
    }
    window.addEventListener('error', function (e) {
      showGameError(e.message || 'impossibile caricare uno script');
    });
  </script>
  <script type="module" src="./src/main.js" onerror="showGameError('impossibile caricare src/main.js')"></script>
</body>
</html>
